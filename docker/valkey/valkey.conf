# Pudim Valkey configuration
bind 0.0.0.0
port 6379
protected-mode yes

# Persistence
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Networking
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice